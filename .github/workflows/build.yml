name: DOVE OS Build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib grub-pc-bin xorriso qemu-system-x86

      - name: Build ISO
        run: make

      - name: Validate Multiboot2 kernel
        run: make check

      - name: QEMU boot smoke test
        run: |
          timeout 8s qemu-system-i386             -cdrom build/dove.iso             -display none             -serial none             -monitor none || test $? -eq 124

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: dove-os-iso
          path: build/dove.iso
